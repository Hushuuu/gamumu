
<svg xmlns="http://www.w3.org/2000/svg"
  width="60"
  height="86"
  viewBox="0 0 160 230"
  style="color:#6757c8">

  <defs>

```
<!-- 淡色卡面 -->
<linearGradient id="arcaneBgLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="45%" stop-color="#f5f6fb"/>
  <stop offset="100%" stop-color="#e4e6f0"/>
</linearGradient>

<!-- 淡金紫邊框 -->
<linearGradient id="arcaneBorderLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#b39b48"/>
  <stop offset="25%" stop-color="#eadb91"/>
  <stop offset="50%" stop-color="#a995d8"/>
  <stop offset="75%" stop-color="#e2d48a"/>
  <stop offset="100%" stop-color="#9c8540"/>
</linearGradient>

<!-- 淡紫藍寶石 -->
<radialGradient id="arcaneGemLight">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="35%" stop-color="#d9f6ff"/>
  <stop offset="70%" stop-color="#a9b8ed"/>
  <stop offset="100%" stop-color="#766bb5"/>
</radialGradient>

<!-- 數字 -->
<linearGradient id="numberLight" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="45%" stop-color="currentColor"/>
  <stop offset="100%" stop-color="currentColor"/>
</linearGradient>

<!-- 柔和陰影 -->
<filter id="lightShadow"
        x="-30%" y="-30%"
        width="160%" height="160%">
  <feDropShadow
    dx="0"
    dy="4"
    stdDeviation="4"
    flood-color="#7c8190"
    flood-opacity=".20"/>
</filter>

<!-- 柔和發光 -->
<filter id="softGlow"
        x="-100%" y="-100%"
        width="300%" height="300%">
  <feGaussianBlur
    stdDeviation="1.8"
    result="blur"/>

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
```

  </defs>

