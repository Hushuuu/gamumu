
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="86" viewBox="0 0 160 230">
  <defs>
    <!-- 象牙白卡面 -->
    <linearGradient id="royalBg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#dfe3e8"/>
    </linearGradient>

```
<!-- 皇家金 -->
<linearGradient id="royalGold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#8b6a20"/>
  <stop offset="25%" stop-color="#f3d878"/>
  <stop offset="50%" stop-color="#fff3a8"/>
  <stop offset="75%" stop-color="#c79b32"/>
  <stop offset="100%" stop-color="#765515"/>
</linearGradient>

<!-- 深藍 -->
<linearGradient id="royalBlue" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#24364f"/>
  <stop offset="100%" stop-color="#101a2a"/>
</linearGradient>

<filter id="royalShadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="5" stdDeviation="5"
                flood-color="#000000" flood-opacity=".28"/>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="1.5"/>
</filter>
